appId: com.financehub.desktop
productName: FinanceHub
copyright: Copyright © 2026 FinanceHub

directories:
  output: release

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!**/*.map'
  - '!**/.env*'

asar: true
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FinanceHub
