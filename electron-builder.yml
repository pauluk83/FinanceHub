appId: com.financehub.desktop
productName: FinanceHub
copyright: Copyright © 2026 FinanceHub

directories:
  output: release

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!**/*.map'
  - '!**/.env*'
  # The renderer is bundled into dist/ and the main process requires only Node
  # built-ins and electron, so no npm package is needed at runtime. Shipping
  # @supabase/supabase-js and React again added ~13 MB to the asar.
  - '!node_modules/**'

asar: true
compression: maximum

# Chromium ships 55 locale packs (~49 MB); this app is English only.
electronLanguages:
  - en-GB

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FinanceHub
