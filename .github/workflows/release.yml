name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -p app/tsconfig.json --noEmit

      - name: Build Windows installer
        run: npm run dist:win

      - name: Check release artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/FinanceHub-Setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer not built: $installer" }
          if (-not (Test-Path 'release/update/update-manifest.json')) { throw 'Delta update manifest was not built' }
          if (-not (Test-Path 'release/update/FinanceHub-app.asar')) { throw 'Delta update archive was not built' }
          # The checksum file and the manifest hashes are derived from the
          # uploaded bytes by scripts/github-release.mjs, never from an earlier
          # build left in release/.

      - name: Generate release evidence
        run: node scripts/release-evidence.mjs

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-release.mjs
