name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -p app/tsconfig.json --noEmit

      - name: Build Windows installer
        run: npm run dist:win

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/FinanceHub-Setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer not built: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  FinanceHub-Setup-$version.exe" | Out-File -Encoding ascii release/SHA256SUMS.txt
          Write-Output "sha256 $hash"

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-release.mjs
