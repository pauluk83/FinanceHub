name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -p app/tsconfig.json --noEmit

      - name: Test with the private workbook when available
        run: |
          if [ -f data/workbook.json ]; then
            npm test
          else
            echo "SKIP npm test: data/workbook.json is intentionally absent from the public repository."
          fi

      - name: Build hosted web bundle
        run: npm run build:web:hosted

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test
